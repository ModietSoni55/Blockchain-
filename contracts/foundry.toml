[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
verbosity = 2

# Remappings for OpenZeppelin and Forge Standard Library
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read", path = "./script" },
    { access = "read-write", path = "./broadcast" }
]

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 64 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
